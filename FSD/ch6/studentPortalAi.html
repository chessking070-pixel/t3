<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Card</title>
</head>
<body>
    <div class="d-flex flex-wrap justify-content-evenly align-items-center border border-5 p-4 gap-3" style="max-width: 2000px; margin: auto;">
        <h1>Student portal</h1>
        <i class="bi bi-search"></i>
        <i class="bi bi-bell"></i>
        <i class="bi bi-person"></i>
        <button>User</button>
        
    </div>
    <div class="card w-25">
        <div class="card-header text-danger">Assignment</div>
        <img src="i5.jpg" class="card-img-top"/>
        <div class="card-body">
            <h5 class="card-title">Asssignment</h5>
            <p class="card-text"></p>
            <a href="#" class="btn btn-danger w-100"><i class="bi bi-bag-check-fill"></i></a>
        </div>
    </div>
</body>
</html>
